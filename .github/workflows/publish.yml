name: Publish

on:
  workflow_dispatch: # manual trigger: Actions → Publish → Run workflow

# Only one deployment at a time; don't cancel a deployment that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 1) Reuse the existing build workflow instead of duplicating the build steps.
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      pull-requests: write # build.yml asks for this (coverage PR comment)

  # 2) Take the built web app and package it for GitHub Pages.
  package:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: tetris-web-app
          path: dist

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  # 3) Deploy in its own job (as recommended by actions/deploy-pages), so the
  #    github-pages artifact is fully registered before it gets looked up.
  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write    # to deploy to GitHub Pages
      id-token: write # to verify the deployment comes from this repo
      actions: read   # to read this run's artifacts
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4