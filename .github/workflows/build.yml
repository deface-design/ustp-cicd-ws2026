name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call: # lets other workflows (publish.yml) reuse this build

permissions:
  contents: read
  pull-requests: write # lets the coverage action comment on pull requests

permissions:
  contents: read
  pull-requests: write # lets the coverage action comment on pull requests

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false # let both operating systems finish, even if one fails
      matrix:
        os: [ubuntu-latest, windows-latest]

    defaults:
      run:
        shell: bash # same shell on Linux and Windows (Git Bash)
        working-directory: typescript-tetris-game-1.0.0

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      # --base=./ makes the asset paths in index.html relative,
      # so the built app works from any folder or sub-path.
      - name: Build
        run: npm run build -- --base=./

      - name: Upload build artifacts
        if: matrix.os == 'ubuntu-latest' # the web app is identical on both OS, upload it once
        uses: actions/upload-artifact@v4
        with:
          name: tetris-web-app
          path: typescript-tetris-game-1.0.0/dist/
          if-no-files-found: error

      - name: Run unit tests
        run: npm test

      - name: Upload test results
        if: ${{ !cancelled() }} # also upload when tests fail
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: typescript-tetris-game-1.0.0/test-results/
          if-no-files-found: error

      - name: Measure code coverage
        if: ${{ !cancelled() }}
        run: npm run coverage

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: typescript-tetris-game-1.0.0/coverage/
          if-no-files-found: error

      - name: Coverage summary (job summary + PR comment)
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          working-directory: typescript-tetris-game-1.0.0
