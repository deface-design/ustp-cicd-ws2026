name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript-tetris-game-1.0.0

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      # --base=./ makes the asset paths in index.html relative,
      # so the built app works from any folder or sub-path.
      - name: Build
        run: npm run build -- --base=./

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tetris-web-app
          path: typescript-tetris-game-1.0.0/dist/
          if-no-files-found: error
